name: CI

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -q
